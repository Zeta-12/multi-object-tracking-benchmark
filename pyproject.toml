[project]
name = "multi-object-tracking-benchmark"
version = "0.1.0"
description = "SORT-family multi-object trackers written from scratch and benchmarked on MOT17 and MOT20 with TrackEval."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Julien Beloin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "requests>=2.32",
    "scipy>=1.14",
    "trackeval",
]

[project.scripts]
mot = "mot_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mot_bench"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
trackeval = { git = "https://github.com/JonathonLuiten/TrackEval", rev = "12c8791b303e0a0b50f753af204249e622d0281a" }
